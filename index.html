<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall UKMPPD</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --text:#1d1c1a; --muted:#6b6862; --line:#dedbd3;
  --accent:#2f5d8a; --accent-ink:#ffffff; --good:#2e7d4f; --good-bg:#e4f2e9; --bad:#b3372f; --bad-bg:#f8e4e1;
  --warn:#9a6a00; --warn-bg:#fbf0d4; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  --h1:#d6e4f2; --h2:#9fc0e2; --h3:#5b8fc4; --h4:#2f5d8a;
  --touched:#e2b34a; --card-touched:#a9c6e4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141413; --surface:#1e1e1c; --surface-2:#282825; --text:#ecebe6; --muted:#a19e96; --line:#34332f;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --good:#7cc79a; --good-bg:#1d3326; --bad:#ec8f86; --bad-bg:#3a1f1c;
  --warn:#e3bb5c; --warn-bg:#3a3018; --shadow:none;
  --h1:#24364a; --h2:#2f5680; --h3:#4f86bd; --h4:#8dbbe8;
  --touched:#a8822f; --card-touched:#3d6690;
}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1e1e1c; --surface-2:#282825; --text:#ecebe6; --muted:#a19e96; --line:#34332f;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --good:#7cc79a; --good-bg:#1d3326; --bad:#ec8f86; --bad-bg:#3a1f1c;
  --warn:#e3bb5c; --warn-bg:#3a3018; --shadow:none;
  --touched:#a8822f; --card-touched:#3d6690;
  --h1:#24364a; --h2:#2f5680; --h3:#4f86bd; --h4:#8dbbe8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:-.01em;cursor:pointer}
header .sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.opt:disabled{opacity:1;cursor:default}
.small{font-size:13px;padding:6px 10px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.subj{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.subj:first-of-type{border-top:0}
.subjgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.subjgrid .subj{border-top:1px solid var(--line)}
.subjgrid .subj:nth-child(-n+2){border-top:0}
.overall .ovl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin:12px 0 6px}
.overall .ovl b{font-size:20px;font-variant-numeric:tabular-nums}
.overall .bar{height:12px}
.overall .bar.cardbar{height:8px;margin-top:0}
@media (max-width:720px){.subjgrid{grid-template-columns:1fr}.subjgrid .subj:nth-child(2){border-top:1px solid var(--line)}}
.subj .name{font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;grid-column:1/-1;display:flex;gap:2px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;flex:none}
.bar i.t{background:var(--touched)}
.bar.cardbar{height:4px;margin-top:-2px}
.bar.cardbar i{background:var(--accent)}
.bar.cardbar i.t{background:var(--card-touched)}
.barlab{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:-4px}
.barkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:-4px 0 4px}
.barkey span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-right:4px}
.pill.flag{background:var(--warn-bg);color:var(--warn)}
.stem{font-size:17px;margin:8px 0 14px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{text-align:left;display:flex;gap:10px;align-items:flex-start;padding:11px 14px}
.opt .k{font-weight:700;color:var(--muted);min-width:18px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.conf{margin-top:14px}
.conf .row button{flex:1;min-width:90px}
.verdict{font-weight:700;font-size:18px;margin:14px 0 6px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.why{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:10px 0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0}
.imgs figure{margin:0}
.imgs img,.qimg{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;background:#fff}
.imgs figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.cards-list{margin:8px 0 0;padding:0;list-style:none}
.cards-list li{border-left:3px solid var(--accent);padding:6px 10px;margin:6px 0;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.fc-q{font-size:20px;font-weight:600;margin:10px 0 18px}
.fc-a{font-size:17px;padding:14px;background:var(--surface-2);border-radius:10px;margin-bottom:14px;white-space:pre-line}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px}
.grades small{font-size:11px;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.progress{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:10;padding:12px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.kbd{font-size:11px;color:var(--muted);margin-top:10px}
select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
h2{font-size:16px;margin:0 0 10px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.goal-top b{font-size:22px;font-variant-numeric:tabular-nums}
.goalbar{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.goalbar.done i{background:var(--good)}
.mini{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.mini i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.mini.done i{background:var(--good)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:520px}
.heat span{aspect-ratio:1;border-radius:3px;background:var(--surface-2);min-width:8px}
.heat span[data-l="1"]{background:var(--h1)} .heat span[data-l="2"]{background:var(--h2)}
.heat span[data-l="3"]{background:var(--h3)} .heat span[data-l="4"]{background:var(--h4)}
.heat span.today{outline:2px solid var(--text);outline-offset:1px}
.heat span.future{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--surface-2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;font-size:13px;color:var(--muted)}
.kpis b{display:block;font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
#srchQ{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);min-width:0}
#srchQ:focus{outline:2px solid var(--accent);outline-offset:1px}
.tour-hl{position:relative;z-index:21;outline:3px solid var(--accent);outline-offset:4px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
#tourBox{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#tourBox h3{margin:4px 0 6px;font-size:17px}#tourBox p{margin:0 0 12px;font-size:14px;line-height:1.55}
.agree{display:grid;gap:10px;margin:14px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.5}
.agree label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.agree input[type=checkbox],.agree input[type=radio]{margin-top:4px;flex:none;width:18px;height:18px}
.agree.optional{background:transparent;border-style:dashed}
.agree input:not([type=checkbox]):not([type=radio]),.agree select,.card select,.card input[type=number]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.sus{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.sus label{margin-left:8px}
#rTxt{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);margin-bottom:6px}
.mark.on{background:var(--warn-bg);border-color:var(--warn);color:var(--text)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sgrid figure{margin:0}.sgrid img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.sgrid figcaption{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}
.slist{list-style:none;padding:0;margin:0}.slist li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}.slist li:first-child{border-top:0}
.slist summary{cursor:pointer} mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 2px}
.tth{font-size:15px;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.tchart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px;align-items:end}
.tcol{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tstack{height:90px;width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.tstack i{display:block;width:100%;border-radius:4px 4px 0 0}
.tstack i.q{background:var(--good)} .tstack i.c{background:var(--accent)}
.tcol .tv{color:var(--text);min-height:14px} .tcol .tl.today{color:var(--text);font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;display:none;z-index:20;white-space:nowrap}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-200%);visibility:hidden;background:var(--good);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;z-index:30;transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.notebox{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.notebox summary{cursor:pointer;font-size:14px}
.notebox textarea,.notebox input{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0 6px}
.sprint b{font-variant-numeric:tabular-nums}
.left-today{display:flex;flex-direction:column;align-items:center;text-align:center;margin:14px 0 4px;padding:14px;border-radius:12px;background:var(--surface-2)}
.left-today span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.left-today b{font-size:40px;line-height:1.15;color:var(--accent);margin:2px 0}
.left-today.done b{color:var(--good)}
.left-today small{font-size:13px;color:var(--muted)}
#toast.show{transform:translate(-50%,0);visibility:visible}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grades{grid-template-columns:repeat(2,1fr)}
  .stem{font-size:16px}
}
</style>

<body>
<div class="wrap">
  <header>
    <h1 id="home">Recall UKMPPD</h1>
    <span class="sp"></span>
    <button class="small ghost" id="tourBtn" title="Tur fitur" style="display:none">❓ Tur</button>
    <button class="small ghost" id="themeBtn" title="Tema">◐</button>
  </header>
  <main id="app"></main>
</div>
<div id="lightbox"><img alt=""></div>
<div id="tip"></div><div id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script>window.SHARE_BUILD=true;window.COLLECT_URL="https://script.google.com/macros/s/AKfycbxWXkrpLKvAOCoRUsR2jRh1tqkRK1gn7npp4z5HYPmkj48Kv4ysqJojELZDVDLnQ9eP/exec";window.APP_VER="2026-10-12";window.BANK_VER="1149q-10226094";</script>
<script>
// ---------- data loading (missing subject files are skipped, so the list can include unbuilt ones) ----------
const DATA_FILES = ["endokrin","integumen1","integumen2","hematologi","nefrologi","muskulo","kardio","pulmo","geh","infeksi","neuro","psikiatri","pediatri","obgyn1","obgyn2","bedah","mata","tht","forensik","ikm"];
window.DECKS = [];
function loadData(){
  return Promise.all([...DATA_FILES, "_sources", "_slides", "_extra", "_build"].map(s => new Promise(res => {
    const el = document.createElement("script");
    el.src = "data/" + s + ".js"; el.onload = res; el.onerror = res;
    document.head.appendChild(el);
  })));
}

// ---------- time (debug: ?now=+2d / +6h shifts the clock to test scheduling) ----------
const OFFSET = (() => {
  const m = /now=\+(\d+)([dhm])/.exec(location.search);
  return m ? +m[1] * {d:864e5,h:36e5,m:6e4}[m[2]] : 0;
})();
const now = () => Date.now() + OFFSET;
const DAY = 864e5, MIN = 6e4;
const dayKey = t => new Date(t).toLocaleDateString("sv");

// ---------- storage ----------
// SHARE = friend build (tools/build_share.py injects window.SHARE_BUILD): own storage, goal-first onboarding,
// no notes box, no export/import, no coretan. The owner's copy runs with SHARE = false (unchanged).
const SHARE = !!window.SHARE_BUILD;
const KEY = SHARE ? "recall-ukmppd-share-v1" : "mediko-recall-v1";
const THEME_KEY = SHARE ? "recall-ukmppd-theme" : "mediko-theme";
const COLLECT_URL = window.COLLECT_URL || "", COLLECT_FROM = "2027-02-01";   // collector URL (build injects); study data only sent from this date
const APP_VER = window.APP_VER || "dev"; let BANK_VER = window.BANK_VER || "dev";   // BANK_VER gets "+<pack id>" when an update pack is applied
let S = { items:{}, days:{}, dq:{}, time:{}, notes:[], custom:[], settings:{newPerDay:20, dailyGoal:50, sprint:true, deadline:"2026-10-31"} };
// notes: [{t, qid, text}] written while studying, exported for Claude to turn into cards
// custom: [{id:"<qid>#u<n>", qid, q, a, t}] flashcards the user wrote; scheduled like any card
// days: date -> items answered (questions + cards); dq: date -> [questions answered, correct]
// sprint: daily item goal follows the plan (new questions + re-asks + cards ≈ 1.8 items per new question)
const goal = () => S.settings.sprint && Object.keys(Q).length ? Math.max(S.settings.dailyGoal || 50, Math.round(sprintInfo().perDay * 1.8)) : (S.settings.dailyGoal || 50);
const todayCount = () => S.days[dayKey(now())] || 0;
function load(){
  const def = S.settings;
  try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
  S.dq = S.dq || {}; S.notes = S.notes || []; S.custom = S.custom || []; S.time = S.time || {}; S.marks = S.marks || {}; S.log = S.log || []; S.outbox = S.outbox || []; S.reports = S.reports || []; S.probe = S.probe || {};
  S.settings = Object.assign({}, def, S.settings);   // new settings keys get defaults
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ---------- index ----------
let Q = {};          // qid -> question (+ deck)
let CARDS = {};      // cardId -> {q,a,qid}
function buildIndex(){
  const ord = s => { const i = DATA_FILES.indexOf(s); return i < 0 ? 999 : i; };          // decks added by an update pack go last
  window.DECKS.sort((a,b) => ord(a.slug) - ord(b.slug));  // scripts load async
  for(const d of window.DECKS){
    d.questions.forEach(q => {
      q.deck = d; Q[q.id] = q;
      (q.cards||[]).forEach((c,i) => { if(!c.del) CARDS[q.id+"#"+i] = {...c, qid:q.id}; });   // {"del":true} = deleted card (keeps later indices stable)
    });
  }
  for(const c of S.custom) if(Q[c.qid]) CARDS[c.id] = c;
}
// ---------- sprint (finish every question once by the deadline; reviews pushed later) ----------
function sprintInfo(){
  const seen = Object.keys(Q).filter(id => S.items[id]).length;
  const remaining = Object.keys(Q).length - seen;          // total is counted from the loaded data (no manual constant)
  const end = new Date(S.settings.deadline + "T23:59:59").getTime();
  const daysLeft = Math.max(1, Math.ceil((end - now()) / DAY));
  const perDay = Math.ceil((remaining + newToday()) / daysLeft);   // includes what was already done today
  return {seen, remaining, daysLeft, perDay};
}
function newLimit(){ return S.settings.sprint ? sprintInfo().perDay : S.settings.newPerDay; }
// minutes: new question ≈ 1.75 (answer + read explanation), review question ≈ 0.75, flashcard ≈ 0.3, re-ask after a miss ≈ 1
function estimateMinutes(newCount, dueQ, dueC){ return Math.round(newCount*1.75 + newCount*0.35*1.0 + newCount*0.35*1.5*0.3 + dueQ*0.75 + dueC*0.3); }
const cardIds = q => (q.cards||[]).flatMap((c, i) => c.del ? [] : [q.id + "#" + i]);   // questions without cards: the re-ask itself does the work
const SKDI_RANK = {"4A":0,"4":0,"3B":1,"3A":2,"3":2,"2":3,"1":4};

// ---------- SRS (SM-2 style with learning steps) ----------
const STEPS = [10*MIN, 1*DAY];
function st(id){ return S.items[id]; }
function newState(){ return {due:0, ivl:0, ease:2.5, reps:0, lapses:0, step:0, learning:true, hist:[]}; }
// grade: 0 again, 1 hard, 2 good, 3 easy
function schedule(s, g, t){
  if(S.settings.sprint) return scheduleSprint(s, g, t);
  s = {...s};
  if(g === 0){
    s.lapses += s.reps ? 1 : 0; s.learning = true; s.step = 0;
    s.ease = Math.max(1.3, s.ease - .2); s.ivl = 0; s.due = t + STEPS[0];
  } else if(s.learning){
    if(g === 3){ s.learning = false; s.ivl = 4; s.due = t + 4*DAY; }
    else if(g === 1){ s.due = t + STEPS[s.step]; }
    else {
      s.step++;
      if(s.step >= STEPS.length){ s.learning = false; s.ivl = 1; s.due = t + DAY; }
      else s.due = t + STEPS[s.step];
    }
  } else {
    if(g === 1){ s.ease = Math.max(1.3, s.ease - .15); s.ivl = Math.max(1, s.ivl * 1.2); }
    if(g === 2){ s.ivl = Math.max(s.ivl + 1, s.ivl * s.ease); }
    if(g === 3){ s.ease += .15; s.ivl = Math.max(s.ivl + 2, s.ivl * s.ease * 1.3); }
    s.ivl = Math.round(s.ivl); s.due = t + s.ivl * DAY;
  }
  s.reps++;
  return s;
}
// Sprint: a miss comes back ~3 minutes later in the same session until answered correctly once;
// after that, reviews are spaced wide (2–7+ days) so daily time goes to NEW material.
function scheduleSprint(s, g, t){
  s = {...s};
  if(g === 0){
    s.lapses += s.reps ? 1 : 0; s.learning = true; s.step = 0;
    s.ease = Math.max(1.3, s.ease - .2); s.ivl = 0; s.due = t + 3*MIN;
  } else if(s.learning){
    s.learning = false;
    s.ivl = g === 3 ? 7 : g === 2 ? (s.reps === 0 ? 7 : 3) : 2;   // first-try confident correct → 7 days
    s.due = t + s.ivl*DAY;
  } else {
    if(g === 1){ s.ease = Math.max(1.3, s.ease - .15); s.ivl = Math.max(2, s.ivl * 1.2); }
    if(g === 2){ s.ivl = Math.max(s.ivl + 2, s.ivl * s.ease); }
    if(g === 3){ s.ease += .15; s.ivl = Math.max(s.ivl + 4, s.ivl * s.ease * 1.3); }
    s.ivl = Math.round(s.ivl); s.due = t + s.ivl * DAY;
  }
  s.reps++;
  return s;
}
function fmtIvl(ms){
  if(ms < 60*MIN) return Math.round(ms/MIN) + " mnt";
  if(ms < DAY) return Math.round(ms/36e5) + " jam";
  const d = Math.round(ms/DAY); return d < 31 ? d + " hr" : (d/30).toFixed(1).replace(".0","") + " bln";
}
function preview(id, g){ const s = st(id) || newState(); return fmtIvl(schedule(s, g, now()).due - now()); }
function record(id, g, extra){
  const t = now();
  const s = schedule(st(id) || newState(), g, t);
  s.hist = [...(s.hist||[]).slice(-19), [t, g, ...(extra?[extra]:[])]];
  S.items[id] = s;
  if(SHARE){ const q = Q[id.split("#")[0]];
    dataLog({t, id, deck: q ? q.deck.slug : "", src: q ? (q.lat || "mediko") : "", kind: id.includes("#") ? "kartu" : "soal", mode: "belajar", g,
      ok: extra && extra.pick !== undefined && q ? extra.pick === q.ans : undefined, conf: extra && extra.conf ? ({3:"yakin",2:"ragu",1:"tebak"})[extra.conf] : undefined,
      ms: extra && extra.ms, changed: extra && extra.changed}); }
  const k = dayKey(t), before = S.days[k]||0; S.days[k] = before + 1;
  save();
  if(before < goal() && before + 1 >= goal()) toast(`🎯 Target hari ini tercapai: ${goal()} item! 🔥 ${streak()} hari beruntun`);
}

// ---------- queues ----------
function deckFilter(slug){ return q => !slug || q.deck.slug === slug; }
function dueItems(slug){
  const t = now(), out = [];
  for(const [id,s] of Object.entries(S.items)){
    if(s.due > t) continue;
    const q = Q[id.split("#")[0]];
    if(!q || (slug && q.deck.slug !== slug)) continue;
    if(id.includes("#") && !CARDS[id]) continue;
    out.push(id);
  }
  return out.sort((a,b) => S.items[a].due - S.items[b].due);
}
function newQuestions(slug){
  return Object.values(Q).filter(q => !S.items[q.id] && deckFilter(slug)(q))
    .sort((a,b) => (SKDI_RANK[a.skdi]??5) - (SKDI_RANK[b.skdi]??5) || DATA_FILES.indexOf(a.deck.slug) - DATA_FILES.indexOf(b.deck.slug) || a.p - b.p);
}
function newToday(){
  const k = dayKey(now()); let n = 0;
  for(const s of Object.values(S.items)) if(s.hist && s.hist[0] && dayKey(s.hist[0][0]) === k && !s.cardChild) n++;
  return n;
}
function nextLearningDue(slug){
  let m = Infinity;
  for(const [id,s] of Object.entries(S.items)){ const q = Q[id.split("#")[0]]; if(q && (!slug || q.deck.slug === slug) && s.due < m) m = s.due; }
  return m;
}

// ---------- session ----------
let SES = null;
function startSession(mode, slug){
  SES = {mode, slug, done:0, right:0, wrong:0, startedNew:0};
  next();
}
function pick(){
  if(SES.mode === "list") return SES.queue.length ? SES.queue[0] : null;   // search → practice a fixed list
  // modes: mix (due by date, new by SKDI) · random/rnew (everything shuffled across subjects) · deck · new · cards
  const rnd = SES.mode === "random" || SES.mode === "rnew" || SES.mode === "randomq";
  const extra = SES.mode === "new" || SES.mode === "rnew";      // +20 batch that ignores the daily limit
  const noCards = extra || SES.mode === "randomq";                // randomq = random, questions only
  const due = dueItems(SES.slug).filter(id => SES.mode !== "cards" || id.includes("#")).filter(id => !noCards || !id.includes("#"));
  const one = arr => rnd ? arr[Math.floor(Math.random()*arr.length)] : arr[0];
  const newOk = SES.mode !== "cards" && (extra ? SES.startedNew < 20 : newLimit() - newToday() > 0);
  const n = newOk ? newQuestions(SES.slug) : [];
  if(S.settings.sprint && SES.mode !== "cards"){
    const relearn = due.filter(id => S.items[id].learning && !id.includes("#"));   // missed this session → until correct
    if(relearn.length) return relearn[0];
    const freshCards = SES.mode === "randomq" ? [] : due.filter(id => id.includes("#") && !S.items[id].reps);   // cards unlocked by a miss
    if(freshCards.length) return freshCards[0];
    if(n.length) return one(n).id;                                                // then new material
    return due.length ? one(due) : null;                                          // then spaced reviews
  }
  if(due.length) return one(due);
  return n.length ? one(n).id : null;
}
function next(){
  if(SES.mode === "list" && SES.cur){                 // finished SES.cur: drop it; a missed question comes back at the end (max 2×)
    const c = SES.cur, i = SES.queue.indexOf(c); if(i >= 0) SES.queue.splice(i, 1);
    const h = (S.items[c] && S.items[c].hist) || [], last = h[h.length - 1];
    if(!c.includes("#") && last && last[1] === 0 && (SES.again[c] = (SES.again[c]||0) + 1) <= 2) SES.queue.push(c);
    SES.cur = null;
  }
  const id = pick();
  if(!id) return renderDone();
  SES.cur = id;
  id.includes("#") ? renderCard(id) : renderQuestion(id);
}

// fixed probe: 30 Mediko questions spread evenly over the bank (no image, no unsure key); frozen on first use.
// Answered without feedback, never touches the SRS schedule.
function probeIds(){
  if(S.probe.ids) return S.probe.ids;
  const pool = Object.values(Q).filter(q => !q.lat && !q.img && q.src !== "flag").sort((a,b) => a.id < b.id ? -1 : 1);
  const step = pool.length / 30, ids = [];
  for(let i = 0; i < 30; i++) ids.push(pool[Math.floor(i * step + step / 2)].id);
  return ids;
}
const addDays = (d, n) => { const x = new Date(d + "T00:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("sv"); };
const probeLabel = k => ({pretest: "Pre-test", retensi1: "Cek retensi bulan ke-1", retensi2: "Cek retensi bulan ke-2", retensi3: "Cek retensi menjelang target"})[k] || k;
function probeDue(){
  if(!dataOn() || collectOpen()) return null;
  const runs = S.probe.runs || {}, today = dayKey(now());
  if(!runs.pretest) return "pretest";
  const base = runs.pretest.date;
  if(!runs.retensi1 && today >= addDays(base, 30)) return "retensi1";
  if(!runs.retensi2 && today >= addDays(base, 60)) return "retensi2";
  if(!runs.retensi3 && S.settings.deadline && today >= addDays(S.settings.deadline, -7) && today >= addDays(base, 14)) return "retensi3";
  return null;
}
let PROBE = null;
function startProbe(key){
  S.probe.ids = probeIds(); S.probe.runs = S.probe.runs || {};
  PROBE = {key, ids: shuffle(S.probe.ids.length).map(i => S.probe.ids[i]), i: 0, answers: []}; renderProbe();
}
function renderProbe(){
  VIEW = "q";
  const P = PROBE, q = Q[P.ids[P.i]];
  if(!q){ P.i++; return P.i < P.ids.length ? renderProbe() : finishProbe(); }
  const order = shuffle(q.opts.length), t0 = Date.now(); let sel = null, changes = 0;
  app.innerHTML = `<div class="topbar"><span>🧪 ${esc(probeLabel(P.key))} · ${P.i + 1}/${P.ids.length}</span><button class="small ghost" id="pQuit">Lanjutkan nanti</button></div>
  <div class="card"><div class="muted" style="font-size:13px">Tes singkat tanpa pembahasan: jawab sebisanya tanpa membuka catatan. Tidak memengaruhi jadwal belajarmu.</div>
    <div class="stem">${esc(q.stem)}</div>
    <div class="opts" style="margin-top:12px">${order.map((o,i)=>`<button class="opt" data-o="${o}"><span class="k">${"ABCDE"[i]}</span><span>${esc(q.opts[o])}</span></button>`).join("")}</div>
    <div class="conf"><div class="muted" style="font-size:13px;margin-bottom:6px">Seberapa yakin?</div>
      <div class="row"><button data-c="3" disabled>Yakin</button><button data-c="2" disabled>Ragu</button><button data-c="1" disabled>Tebak</button></div></div></div>`;
  const opts = [...app.querySelectorAll(".opt")], confs = [...app.querySelectorAll("[data-c]")];
  const choose = b => { if(sel !== null && sel !== +b.dataset.o) changes++; sel = +b.dataset.o; opts.forEach(x=>x.classList.toggle("sel", x===b)); confs.forEach(c=>c.disabled=false); };
  opts.forEach(b => b.onclick = () => choose(b));
  const submit = conf => {
    const a = {t: now(), id: q.id, deck: q.deck.slug, src: "mediko", kind: "soal", mode: P.key === "pretest" ? "pretest" : "retensi",
               run: P.key, ok: sel === q.ans, conf: ({3:"yakin",2:"ragu",1:"tebak"})[conf], ms: Date.now() - t0, changed: changes > 0};
    P.answers.push(a); P.i++;
    P.i < P.ids.length ? renderProbe() : finishProbe();
  };
  confs.forEach(c => c.onclick = () => submit(+c.dataset.c));
  KEYH = e => { const i = "ABCDE".indexOf(e.key.toUpperCase()); if(i >= 0 && opts[i]) choose(opts[i]); if(sel !== null && ["1","2","3"].includes(e.key)) submit(4 - +e.key); };
  $("#pQuit").onclick = () => { PROBE = null; renderHome(); };   // an unfinished run is restarted later
}
function finishProbe(){
  const P = PROBE, right = P.answers.filter(a => a.ok).length;
  P.answers.forEach(dataLog);
  S.probe.runs[P.key] = {date: dayKey(now()), n: P.answers.length, right}; save(); PROBE = null; VIEW = null; KEYH = null;
  app.innerHTML = `<div class="card"><h2>🧪 ${esc(probeLabel(P.key))} selesai</h2>
    <p>Skor: <b>${right}/${P.answers.length}</b>. ${P.key === "pretest" ? "Ini titik awalmu; nanti dibandingkan dengan cek retensi berikutnya." : `Pre-test kamu: ${(S.probe.runs.pretest||{}).right ?? "–"}/30.`}</p>
    <p class="muted" style="font-size:13px">Terima kasih! Hasil disimpan di perangkat ini dan baru dikirim setelah UKMPPD.</p>
    <button class="primary" onclick="renderHome()">Kembali</button></div>`;
}

// ---------- weak spots + bookmarks ----------
// weakList(): up to 30 questions missed before, ranked by confident misses, number of misses, weakness of their
// topics (tag accuracy) and recency; questions already mastered again (interval ≥ 21 d) go last.
function weakList(){
  const tagStat = {}, info = [];
  for(const q of Object.values(Q)){
    const h = ((S.items[q.id] || {}).hist || []).filter(x => x && typeof x[2] === "object" && x[2].pick !== undefined);
    if(!h.length) continue;
    const miss = h.filter(x => x[1] === 0), conf = miss.filter(x => x[2].conf === 3).length;
    for(const t of q.tags || []){ const a = tagStat[t] = tagStat[t] || [0, 0]; a[0] += h.length; a[1] += miss.length; }
    if(miss.length) info.push({id: q.id, miss: miss.length, conf, last: miss[miss.length - 1][0], tags: q.tags || []});
  }
  const tagWeak = t => { const a = tagStat[t]; return a && a[0] ? a[1] / a[0] : 0; };
  const mastered = id => { const x = S.items[id]; return x && !x.learning && x.ivl >= 21; };
  return info.map(x => ({...x, tw: Math.max(0, ...x.tags.map(tagWeak)), m: mastered(x.id) ? 1 : 0}))
    .sort((a, b) => a.m - b.m || b.conf - a.conf || b.miss - a.miss || b.tw - a.tw || b.last - a.last)

const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function matcher(query){
  // every term must match; short terms (≤ 3 chars, e.g. "TB", "KAD") only as whole words
  const terms = norm(query).split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const res = terms.map(t => t.length <= 3 ? new RegExp(`(^|[^a-z0-9])${t}([^a-z0-9]|$)`) : new RegExp(t));
  return text => { const n = norm(text); return res.every(r => r.test(n)); };
}
function hl(text, query, max){
  // snippet around the first hit, with <mark>
  const t = String(text), n = norm(t), terms = norm(query).split(/\s+/).filter(Boolean);
  let at = -1; for(const w of terms){ const i = n.indexOf(w); if(i >= 0 && (at < 0 || i < at)) at = i; }
  const start = Math.max(0, at - 60), cut = t.slice(start, start + (max || 220));
  let out = esc(cut);
  for(const w of terms.sort((a,b) => b.length - a.length)) if(w.length > 1) out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  return (start ? "…" : "") + out + (start + (max || 220) < t.length ? "…" : "");
}

function streak(){
  let n = 0, t = now();
  if(!S.days[dayKey(t)]) t -= DAY;
  while(S.days[dayKey(t)]){ n++; t -= DAY; }
  return n;
}
const seg = (k, n, cls) => k > 0 ? `<i class="${cls}" style="width:${100*k/n}%"></i>` : "";
function deckStats(d){
  const qs = d.questions, t = now();
  let seen=0, mastered=0, due=0, cn=0, copen=0, cmast=0;
  for(const q of qs){ const s = S.items[q.id]; if(s){ seen++; if(!s.learning && s.ivl >= 21) mastered++; } }
  // flashcards of this deck (slide cards + own cards); "dibuka" = unlocked/reviewed at least once
  for(const id of Object.keys(CARDS)){ if(Q[id.split("#")[0]]?.deck !== d) continue; cn++; const s = S.items[id]; if(s){ copen++; if(!s.learning && s.ivl >= 21) cmast++; } }
  for(const [id,s] of Object.entries(S.items)) if(Q[id.split("#")[0]]?.deck === d && s.due <= t) due++;
  return {n:qs.length, seen, mastered, due, cn, copen, cmast};
}
function weakTags(){
  const m = {};

    <h2>Belajar hari ini</h2>
    <p class="muted" style="margin-top:0;font-size:14px"><b>Acak</b>: soal (dan flashcard jatuh tempo) diacak lintas bab, seperti ujian sungguhan. Flashcard yang dilewati tetap menunggu di antrian. <b>Campur, prioritas SKDI</b>: soal baru urut dari SKDI tertinggi.</p>
    <div class="row">
      <button class="primary" onclick="startSession('random')" ${!due && !newLeft?"disabled":""}>Acak: soal + flashcard (${due + Math.min(newLeft,newQuestions().length)})</button>
      <button onclick="startSession('randomq')" ${!(due-cardsDue) && !newLeft?"disabled":""}>Acak: soal saja (${due - cardsDue + Math.min(newLeft,newQuestions().length)})</button>
      <button onclick="startSession('mix')" ${!due && !newLeft?"disabled":""}>Campur, prioritas SKDI</button>
      <button onclick="startSession('cards')" ${!cardsDue?"disabled":""}>Flashcard saja (${cardsDue})</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="weakBtn" ${weakN?"":"disabled"}>🎯 Latih kelemahanku (${weakN})</button>
      <button id="markBtn" ${markN?"":"disabled"}>🔖 Soal ditandai (${markN})</button>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px"><b>Latih kelemahanku</b>: maks. 30 soal yang paling sering salah, terutama yang dijawab "yakin" tapi salah, dari topik dengan akurasi terendah.</div>
  </div>
  <div class="card"><h2>🔎 Cari materi</h2>
    <form id="srchForm" class="row" style="flex-wrap:nowrap"><input id="srchQ" placeholder="mis. TB, KAD, preeklampsia, Bell's palsy…" style="flex:1;margin:0"><button class="primary" type="submit">Cari</button></form>
    <div class="muted" style="font-size:13px;margin-top:6px">Mencari di semua slide materi, soal, pembahasan, dan flashcard. Hasilnya bisa langsung dilatih.</div>
  </div>
  ${(() => { const T = window.DECKS.map(deckStats).reduce((a,x) => { for(const k in x) a[k]=(a[k]||0)+x[k]; return a; }, {});
    const pc = (k,n) => n ? Math.round(100*k/n) : 0;
    return T.n ? `<div class="card overall"><h2>Progress keseluruhan</h2>
    <div class="barkey"><span style="--c:var(--good)">dikuasai</span><span style="--c:var(--touched)">sudah dikerjakan</span><span style="--c:var(--accent)">flashcard dikuasai</span><span style="--c:var(--card-touched)">flashcard dibuka</span></div>
    <div class="ovl"><span>Soal: <b>${pc(T.seen,T.n)}%</b> dikerjakan · <b>${pc(T.mastered,T.n)}%</b> dikuasai</span><span class="meta">${T.seen}/${T.n} soal · ${T.mastered} dikuasai</span></div>
    <div class="bar" title="${T.mastered} dikuasai · ${T.seen-T.mastered} sudah dikerjakan · ${T.n-T.seen} belum">${seg(T.mastered,T.n,"")}${seg(T.seen-T.mastered,T.n,"t")}</div>
    <div class="ovl"><span>Flashcard: <b>${pc(T.copen,T.cn)}%</b> dibuka · <b>${pc(T.cmast,T.cn)}%</b> dikuasai</span><span class="meta">${T.copen}/${T.cn} kartu · ${T.cmast} dikuasai</span></div>
    <div class="bar cardbar" title="${T.cmast} dikuasai · ${T.copen-T.cmast} dibuka · ${T.cn-T.copen} belum terbuka">${seg(T.cmast,T.cn,"")}${seg(T.copen-T.cmast,T.cn,"t")}</div>
    </div>` : ""; })()}
  <div class="card"><h2>Per bab</h2>
    <div class="barkey"><span style="--c:var(--good)">soal dikuasai</span><span style="--c:var(--touched)">soal sudah dikerjakan</span><span style="--c:var(--accent)">flashcard dikuasai</span><span style="--c:var(--card-touched)">flashcard sudah dibuka</span></div>
    <div class="subjgrid">${window.DECKS.length ? window.DECKS.map(d => { const x = deckStats(d); return `
    <div class="subj">
      <div><div class="name">${esc(d.name)}</div><div class="meta">${x.n - x.seen} belum · ${x.due} jatuh tempo</div></div>
      <div class="row"><button class="small" onclick="startSession('deck','${d.slug}')">Review</button><button class="small" onclick="startSession('new','${d.slug}')" ${x.n===x.seen?"disabled":""}>Soal baru</button></div>
      <div class="barlab"><span>Soal ${x.seen}/${x.n} · ${x.mastered} ✓</span><span>${x.cn ? `Kartu ${x.copen}/${x.cn} · ${x.cmast} ✓` : ""}</span></div>
      <div class="bar" title="${x.mastered} dikuasai · ${x.seen - x.mastered} sudah dikerjakan · ${x.n - x.seen} belum">${seg(x.mastered, x.n, "")}${seg(x.seen - x.mastered, x.n, "t")}</div>
      ${x.cn ? `<div class="bar cardbar" title="Flashcard: ${x.cmast} dikuasai · ${x.copen - x.cmast} dibuka · ${x.cn - x.copen} belum terbuka">${seg(x.cmast, x.cn, "")}${seg(x.copen - x.cmast, x.cn, "t")}</div>` : ""}
    </div>`; }).join("") : `<p class="muted">Belum ada data. Pastikan folder <code>data/</code> ada di samping file ini.</p>`}</div>
  </div>
  ${weak.length?`<div class="card"><h2>Topik lemah</h2><div class="weak">${weak.map(([t,n])=>`<span class="pill">${esc(t)} · ${n}×</span>`).join("")}</div></div>`:""}
  ${SHARE ? (S.custom.length ? `<div class="card"><h2>✍️ Flashcard buatan sendiri</h2><p class="muted" style="font-size:13px;margin:0">${S.custom.length} kartu. Kartu ikut muncul di sesi flashcard sesuai jadwal.</p></div>` : "") : S.notes.length || S.custom.length || S.reports.length ? `<div class="card"><h2>✍️ Catatan untukmu & Claude</h2>
    <p class="muted" style="font-size:13px;margin-top:0">${S.notes.length} catatan · ${S.custom.length} flashcard buatan sendiri · ${S.reports.length} laporan/usul. Klik <b>Export catatan</b>, lalu bilang ke Claude "proses catatan saya". File tersimpan di folder Downloads.</p>
    <ul class="cards-list">${S.notes.slice(-5).reverse().map(n => `<li><b>${esc(Q[n.qid] ? Q[n.qid].deck.name + " · " + n.qid : n.qid)}</b><br>${esc(n.text)}</li>`).join("")}</ul>
    <div class="row" style="margin-top:8px"><button class="small" id="expNotes">Export catatan</button><button class="small ghost" id="clrNotes">Hapus catatan yang sudah diproses</button></div></div>` : ""}
  <div class="card"><h2>${SHARE ? "Pengaturan" : "Pengaturan & cadangan"}</h2>
    <div class="row">
      ${SHARE ? "" : `<label class="muted" style="font-size:14px"><input type="checkbox" id="spr" ${S.settings.sprint?"checked":""}> Mode sprint sampai <input type="date" id="dl" value="${S.settings.deadline}"></label>`}
      ${S.settings.sprint ? "" : `<label class="muted" style="font-size:14px">Soal baru/hari <select id="npd">${[10,20,30,50,100].map(n=>`<option ${n==S.settings.newPerDay?"selected":""}>${n}</option>`).join("")}</select></label>`}
      <label class="muted" style="font-size:14px">Target harian <select id="dg">${[20,30,50,80,100,150].map(n=>`<option ${n==goal()?"selected":""}>${n}</option>`).join("")}</select></label>
      <button class="small" id="exp">Export progres</button>
      <button class="small" id="imp">Import progres</button>
    </div>
    ${SHARE && S.settings.data ? `<div class="row" style="margin-top:10px;font-size:13px"><span class="muted">Berbagi data setelah UKMPPD: <b>${S.settings.data.consent === "bersedia" ? `bersedia (${esc(S.settings.data.nick||"")}) · ${S.log.length} jawaban tercatat di perangkat ini, belum ada data belajar yang dikirim` : "tidak ikut"}</b>${S.settings.data.sentAt ? ` · terkirim ${S.settings.data.sentAt}` : ""}</span><button class="small ghost" id="dChange">Ubah pilihan</button></div>` : ""}
    ${SHARE ? `<div class="row" style="margin-top:10px;font-size:13px"><span class="muted">Update soal: ${packInfo()}</span><button class="small" id="packBtn">📥 Pasang update soal</button><input type="file" id="packFile" accept=".json,application/json" hidden></div>
    <div id="packMsg" style="font-size:13px;margin-top:4px"></div>` : ""}
    ${SHARE ? `<div class="row" style="margin-top:10px;font-size:13px"><span class="muted">Mulai dari awal: hapus semua progres di perangkat ini (export dulu bila perlu).</span><button class="small ghost" id="resetAll" style="color:var(--bad)">Reset aplikasi</button></div>
    <div id="resetWarn" style="display:none;margin-top:10px;padding:12px 14px;border:1px solid var(--bad);border-radius:10px;font-size:13px;line-height:1.5">
      <b style="color:var(--bad)">⚠️ Semua progres di perangkat ini akan hilang permanen</b>: riwayat jawaban, jadwal review, flashcard buatan sendiri, soal ditandai, dan target. Ini tidak bisa dibatalkan.
      Kalau masih ingin menyimpan progres, tekan <b>Export progres dulu</b>.
      <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="small" id="resetExp">Export progres dulu</button><button class="small ghost" id="resetNo">Batal</button><button class="small ghost" id="resetYes" style="color:var(--bad)">Ya, hapus semua & mulai dari awal</button></div>
    </div>` : ""}
    <div style="margin-top:12px"><div style="font-size:14px"><b>💡 Usul fitur / perbaikan</b></div>
      <textarea id="usulTxt" rows="2" placeholder="Fitur apa yang kamu inginkan, atau apa yang perlu diperbaiki?" style="width:100%;margin-top:6px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)"></textarea>
      <div class="row"><button class="small" id="usulSend">Kirim usul</button><span class="muted" id="usulMsg" style="font-size:12px"></span></div></div>
    <p class="muted" style="font-size:13px;margin-bottom:0">${SHARE ? "Progres tersimpan otomatis di browser ini (per perangkat & browser). Sebelum pindah ke versi baru aplikasi: klik <b>Export progres</b> di versi lama, buka versi baru, lalu <b>Import progres</b>. Target selesai bisa diubah di kartu 🎯 paling atas." : "Progres disimpan otomatis di browser ini. Export rutin (mis. seminggu sekali) supaya aman kalau data browser terhapus."}${OFFSET?` <b>Debug: jam digeser +${fmtIvl(OFFSET)}.</b>`:""}</p>
  </div>`;
  if($("#npd")) $("#npd").onchange = e => { S.settings.newPerDay = +e.target.value; save(); renderHome(); };
  if($("#spr")) $("#spr").onchange = e => { S.settings.sprint = e.target.checked; save(); renderHome(); };
  if($("#dl")) $("#dl").onchange = e => { if(e.target.value){ S.settings.deadline = e.target.value; save(); renderHome(); } };
  if($("#expNotes")) $("#expNotes").onclick = () => {
    const md = ["# Catatan belajar Recall UKMPPD (" + dayKey(now()) + ")", "",
      "## Catatan", ...S.notes.map(n => `- [${n.qid}] (${dayKey(n.t)}) ${n.text.replace(/\n/g," ")}${Q[n.qid] ? `\n  - Soal: ${Q[n.qid].stem.slice(0,140)}…` : ""}`), "",
      "## Flashcard buatan sendiri", ...S.custom.map(c => `- [${c.qid}] Q: ${c.q} | A: ${c.a}`), "",
      "## Laporan soal & usul fitur", ...S.reports.map(r => `- [${r.qid || "usul"}] (${dayKey(r.t)}) ${r.kind}: ${r.text.replace(/\n/g," ")}`), ""].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([md], {type:"text/markdown"}));
    a.download = `catatan-recall-${dayKey(now())}.md`; a.click();
  };
  if($("#clrNotes")) $("#clrNotes").onclick = () => { S.notes = []; S.reports = []; save(); renderHome(); };
  $("#dg").onchange = e => { S.settings.dailyGoal = +e.target.value; save(); renderHome(); };
  requestAnimationFrame(() => app.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w));
  wireHeat();
  $("#srchForm").onsubmit = e => { e.preventDefault(); const v = $("#srchQ").value.trim(); if(v) renderSearch(v); };
  $("#weakBtn").onclick = () => startList(weakIds, null);
  $("#markBtn").onclick = () => startList(markIds.sort(() => Math.random() - .5), null);
  if(SHARE){ wireGoalCard(); wireDataCards(); flushOutbox(); }
  if($("#dChange")) $("#dChange").onclick = renderGoal;
  if($("#packBtn")){
    const msg = (t, bad) => { $("#packMsg").innerHTML = t; $("#packMsg").style.color = bad ? "var(--bad)" : ""; };
    $("#packBtn").onclick = () => $("#packFile").click();
    $("#packFile").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if(f) installPack(f, msg); };
  }
  if($("#resetAll")){                   // warning panel with export option first; keeps the uid so the user isn't counted twice
    const warn = $("#resetWarn");
    $("#resetAll").onclick = () => { warn.style.display = ""; warn.scrollIntoView({block: "nearest"}); };
    $("#resetNo").onclick = () => { warn.style.display = "none"; };
    $("#resetExp").onclick = () => $("#exp").click();
    $("#resetYes").onclick = () => {
      const uid = S.settings.uid; removeEventListener("pagehide", save); save = () => {};
      try{ localStorage.setItem(KEY, JSON.stringify({settings: uid ? {uid} : {}})); }catch(_){}
      location.reload();
    };
  }
  if($("#usulSend")) $("#usulSend").onclick = () => {
    const t = $("#usulTxt").value.trim(); if(!t) return;
    S.reports.push({t: now(), qid: "", kind: "Usul fitur", text: t}); if(SHARE) queue({type: "usul", text: t}); save();
    $("#usulTxt").value = ""; $("#usulMsg").textContent = SHARE ? (COLLECT_URL ? "Terkirim, terima kasih! 🙏" : "Tersimpan; akan terkirim otomatis.") : "Tersimpan ✓ (ikut di Export catatan)"; };
  if($("#exp")) $("#exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:"application/json"}));
    a.download = SHARE ? `recall-ukmppd-progres-${dayKey(now())}.json` : `recall-ukmppd-backup-${dayKey(now())}.json`; a.click();
  };
  if($("#imp")) $("#imp").onclick = () => $("#importFile").click();
}
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const agreedNow = S.settings && S.settings.agreed, dataNow = S.settings && S.settings.data, uidNow = S.settings && S.settings.uid, outNow = S.outbox || [];
  f.text().then(t => { try{ const d = JSON.parse(t); if(!d.items) throw 0; S = Object.assign({items:{},days:{},dq:{},time:{},notes:[],custom:[],marks:{},log:[],outbox:[],reports:[],probe:{}}, d); S.settings = Object.assign({newPerDay:20, dailyGoal:50, sprint:true, deadline:"2026-10-31"}, d.settings); if(SHARE){ S.settings.goalSet = true; S.settings.agreed = (d.settings && d.settings.agreed) || agreedNow; if(!(d.settings && d.settings.data) && dataNow){ S.settings.data = dataNow; S.settings.uid = S.settings.uid || uidNow; S.outbox = [...S.outbox, ...outNow]; } } for(const c of S.custom) if(Q[c.qid]) CARDS[c.id] = c; save(); renderHome(); }catch(_){ app.insertAdjacentHTML("afterbegin", `<div class="card" style="color:var(--bad)">File tidak valid.</div>`); } });
  e.target.value = "";
};
document.addEventListener("keydown", e => { if(KEYH && !e.metaKey && !e.ctrlKey && !["SELECT","TEXTAREA","INPUT"].includes(e.target.tagName)) KEYH(e); });
$("#home").onclick = renderHome;
if(SHARE){ $("#tourBtn").style.display = ""; $("#tourBtn").onclick = () => { renderHome(); if(S.settings.goalSet && S.settings.agreed) setTimeout(() => startTour(0), 300); }; }

// ---------- theme ----------
(function(){
  let t = null; try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  if(t) document.documentElement.dataset.theme = t;
  $("#themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const n = dark ? "light" : "dark"; document.documentElement.dataset.theme = n;
    try{ localStorage.setItem(THEME_KEY, n); }catch(e){}
  };
})();

// ---------- update packs (SHARE: "📥 Pasang update soal" in Pengaturan; files from tools/build_update.py) ----------
// A pack = {type:"recall-update", id, created, label, newQ, changedQ, decks:[full deck], slides:{slug:rows}, sources, extra, img:{path:dataURL}}.
// Stored in IndexedDB (localStorage fallback), applied at startup only if newer than this package's data (window.BUILD_TS from data/_build.js).
const PACKIMG = {}, PACK_LS = "recall-ukmppd-packs";
let PACKS = [];
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("recall-ukmppd-packs", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("packs", {keyPath: "id"}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function packsGet(){
  try{ const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction("packs").objectStore("packs").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); }
  catch(_){ try{ return JSON.parse(localStorage.getItem(PACK_LS) || "[]"); }catch(_){ return []; } }
}
async function packPut(p){
  try{ const db = await idb(); await new Promise((res, rej) => { const t = db.transaction("packs", "readwrite"); t.objectStore("packs").put(p); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
  catch(_){ const all = (await packsGet()).filter(x => x.id !== p.id); localStorage.setItem(PACK_LS, JSON.stringify([...all, p])); }   // throws if too big
}
const packLive = p => !window.BUILD_TS || p.created > window.BUILD_TS;     // older packs are already inside this package
function applyPacks(){
  for(const p of PACKS.filter(packLive).sort((a, b) => a.created < b.created ? -1 : 1)){
    for(const d of p.decks || []){ const i = window.DECKS.findIndex(x => x.slug === d.slug); if(i >= 0) window.DECKS[i] = d; else window.DECKS.push(d); }
    if(p.sources) window.LATSRC = {...(window.LATSRC || {}), ...p.sources};
    if(p.extra) window.EXTRA = p.extra;
    if(p.slides) window.SLIDES = {...(window.SLIDES || {}), ...p.slides};
    Object.assign(PACKIMG, p.img || {});
    BANK_VER = (window.BANK_VER || "dev") + "+" + p.id;
  }
  if(Object.keys(PACKIMG).length){                    // images shipped in a pack: swap the src of any <img> pointing at them
    const fix = el => { const k = el.getAttribute("src"); if(PACKIMG[k]) el.src = PACKIMG[k]; };
    new MutationObserver(ms => { for(const m of ms) for(const n of m.addedNodes) if(n.nodeType === 1){ if(n.tagName === "IMG") fix(n); n.querySelectorAll && n.querySelectorAll("img").forEach(fix); } })
      .observe(document.body, {childList: true, subtree: true});
  }
}
function packInfo(){
  const live = PACKS.filter(packLive).sort((a, b) => a.created < b.created ? 1 : -1);
  return live.length ? `terpasang: <b>${esc(live[0].label || live[0].id)}</b>` : "belum ada update terpasang";
}
async function installPack(file, out){
  let p; try{ p = JSON.parse(await file.text()); }catch(_){ p = null; }
  if(!p || p.type !== "recall-update" || !p.id || !p.created) return out("File ini bukan file update soal Recall UKMPPD.", true);
  if(!packLive(p)) return out("Update ini sudah termasuk di versi aplikasimu. Tidak perlu dipasang.", true);
  out("Memasang update…");
  try{ await packPut(p); }catch(_){ return out("Gagal menyimpan update di browser ini (penyimpanan penuh/diblokir). Coba Chrome, atau minta versi zip lengkap terbaru.", true); }
  out(`Terpasang: ${esc(p.label || p.id)}. Memuat ulang…`); save(); setTimeout(() => location.reload(), 1200);
}

load();
loadData().then(async () => { if(SHARE){ PACKS = await packsGet(); applyPacks(); } buildIndex(); renderHome(); });
</script>
